<!--Displays the form used to enter a search query for profiles and posts.-->
{% extends 'mini_insta/base.html' %}


{% block content %}

<h1>Search</h1>

<p>{{profile.username}}</p>

<!--Form for searching profiles and posts-->
<form method="GET">
    <label>Search for text, tags, or people:</label>
    <br>

    <textarea name="query"></textarea>
    <br>

    <button type="submit">Search</button>
</form>

{% endblock %}
