<!--Displays all profiles followed by the selected profile.-->

{% extends 'mini_insta/base.html' %}

{% block content %}
<br>
<a class="button" href="{% url 'show_profile' profile.pk %}">
    ← Back to {{ profile.username }}'s profile
</a>


<h1>You're Following: </h1>
{% for following in profile.get_following %}
<!--Displays all profiles followed by this profile-->
<a href="{% url 'show_profile' profile.pk %}" class="link">
    <div class="profile">
        <img src='{{following.profile_image_url}}'>
        <div class="name">
            <h2>{{following.display_name}}</h3>
            <h3>{{following.username}}</h3>
        </div class="name">
    </div class="profile">
</a>
{% endfor %}
{% endblock %}
