<!--Displays a list of all user profiles in the Mini Insta application.-->
{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Showing all profiles</h1>
<!--Displays each profile's username, display name, and profile image-->
{% for profile in profiles %}
<a href="{% url 'show_profile' profile.pk %}" class="link">
    <div class="profile">
        <img src='{{profile.profile_image_url}}'>
        <div class="name">
            <h2>{{profile.display_name}}</h3>
            <h3>{{profile.username}}</h3>
        </div class="name">
    </div class="profile">
</a>
{% endfor %}
{% endblock %}
