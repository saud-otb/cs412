<!--Defines the shared page structure, navigation, stylesheet, and content blocks 
used by all templates. -->
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Mini Insta</title>
         <link rel="stylesheet" href="{% static 'mini_insta/style.css' %}">
    </head>
    <body>
        <header class="site-header">
            <h1>Mini Insta</h1>

            <nav class="main_nav">
                <a href="{% url 'show_all_profiles' %}">All Profiles</a>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'show_feed' %}" class="nav-button">Feed</a>
                    <a href="{% url 'search_results' %}" class="nav-button">Search</a>
                    <a href="{% url 'logout_page' %}" class="nav-button">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-button">Login</a>
                {% endif %}
            </nav>
        </header>
        <main class="page-content">
            {% block content %}
            {% endblock %}
        </main>
    </body>
</html>
