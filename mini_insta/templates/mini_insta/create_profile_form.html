<!--Displays the forms used to create a new Django user and profile.-->
{% extends 'mini_insta/base.html' %}

{% block content %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Create User Account</h1>
    <!--Displays the form to create a user-->
    <table>
        {{user_form.as_table}}
    </table>
    <br>
    <h1>Create Profile</h1>
    <!--Displays the form to create a profile-->
    <table>
        {{form.as_table}}
    </table>
    <!--Submit and cancel buttons-->
    <div class="form-buttons">
        <input type="submit" name="submit" value="Submit">
        <a href="{% url 'show_all_profiles' %}" id="cancel-button" class="button">Cancel</a>
    </div>
</form>
<footer>
        <nav>
            <a href="{% url 'show_all_profiles' %}"><img src="https://www.svgrepo.com/show/114939/go-back-arrow.svg"></a>
        </nav>
{% endblock %}
