{% extends 'game_review/base.html' %}
<!-- Home page, lists all genres. -->

{% block content %}
    <h2>Explore Games in your Favorite Genres</h2>
    <!-- Genre list -->
    {% for genre in genres %}
        <a class="card" href="{% url 'show_genre_games_final' genre.pk %}">
            <h3>{{ genre.name }}</h3>
            <p>{{ genre.description }}</p>
        </a>
    {% endfor %}
{% endblock %}
