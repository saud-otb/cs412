{% extends 'game_review/base.html' %}
<!-- Lists every registered profile. -->

{% block content %}
    <h2>Showing All Profiles</h2>
    <!-- Profile list -->
    {% for profile in profiles %}
        <div>
            <a class="button" href="{% url 'show_profile_final' profile.pk %}">{{profile.display_name}}</a>
            <p>{{profile.bio}}</p>
        </div>
    {% endfor %}
{% endblock %}
