{% load static %}
<!-- Shared page layout, navigation bar, and content block inherited by all templates. -->

<!DOCTYPE html>
<html>
    <head>
        <title>Gamer's Hub</title>
        <!-- Stylesheet -->
        <link rel="stylesheet" href="{% static 'game_review/style.css' %}">
    </head>
    <body>

        <!-- Site header and nav bar -->
        <header class="site-title">
            <h1>Gamer's Hub</h1>
            <h3>The Best Place to Track and Review Video Games</h2>
            <nav class="nav-bar">
                <a class="button" href="{% url 'home_page_final' %}">Home</a>
                <a class="button" href="{% url 'show_all_games_final' %}">All Games</a>
                <a class="button" href="{% url 'search_final' %}">Search</a>
                {% if request.user.is_authenticated %}
                    <a class="button" href="{% url 'my_profile_final' %}">My Profile</a>
                    <a class="button" href="{% url 'logout_page_final' %}">Logout</a>
                {% else %}
                    <a class="button" href="{% url 'login_final' %}">Login</a>
                {% endif %}
            </nav>
        </header>
        <hr>
        <!-- Main content block filled in by each template -->
        <main>
            {% block content %}
            {% endblock %}
        </main>

    </body>
</html>
