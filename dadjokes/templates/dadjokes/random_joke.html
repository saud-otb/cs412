{% extends 'dadjokes/base.html' %}

{% block content %}
    <h1>Random Joke</h1>
    <div class="joke">
        <a href="{% url 'joke' joke.pk %}" class="joke-link">
            <h2>Contributor: {{joke.contributor}}</h2>
            <p>{{joke.text}}</p>
            <p>{{joke.timestamp}}</p>
        </a>
    </div>

    <div class="picture">
        <a href="{% url 'picture' picture.pk %}">
        <img src="{{picture.image_url}}" class="picture-link">
        <p>Contributor: {{picture.contributor}}</p>
        <p>{{picture.contributor}}</p>
        </a>
    </div>
{% endblock %}
