{% extends 'dadjokes/base.html' %}

{% block content %}
    {% for picture in pictures %}
        <div class="picture">
            <a href="{% url 'picture' picture.pk %}">
                <img src="{{picture.image_url}}" class="picture-link">
                <p>Contributor: {{picture.contributor}}</p>
                <p>{{picture.contributor}}</p>
            </a>
        </div>
    {% endfor %}
{% endblock %}
